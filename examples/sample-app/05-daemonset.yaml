# DaemonSet: runs one pod per node. Useful to confirm cluster-wide workloads
# are captured and recreated. Kept lightweight (a sleeping busybox).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent-demo
  namespace: sample-app
  labels:
    app: node-agent-demo
    app.kubernetes.io/part-of: velero-demo
spec:
  selector:
    matchLabels:
      app: node-agent-demo
  template:
    metadata:
      labels:
        app: node-agent-demo
    spec:
      containers:
        - name: agent
          image: busybox:1.36
          command: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      tolerations:
        - operator: Exists # run on all nodes, including any tainted ones
