# A standalone PVC and a standalone Pod that uses it.
# Complements the StatefulSet's templated PVCs by testing a manually-created
# PVC/PV and a bare Pod (not managed by a controller).
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: standalone-data
  namespace: sample-app
  labels:
    app.kubernetes.io/part-of: velero-demo
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: standalone-writer
  namespace: sample-app
  labels:
    app: standalone-writer
    app.kubernetes.io/part-of: velero-demo
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - |
          if [ ! -f /data/hello.txt ]; then
            echo "written before backup at $(date -u)" > /data/hello.txt
          fi
          cat /data/hello.txt
          sleep 3600
      volumeMounts:
        - name: data
          mountPath: /data
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: standalone-data
